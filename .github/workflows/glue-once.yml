# Temporary (phase 4): prints the NDK's native_app_glue so it can be vendored.
name: glue-once
on:
  push:
    branches: [claude/github-squared-framework-review-m3pfj3]
    paths: [.github/workflows/glue-once.yml]
permissions:
  contents: read
jobs:
  glue:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          d=$ANDROID_NDK_HOME/sources/android/native_app_glue
          ls -la "$d"; cat "$ANDROID_NDK_HOME/source.properties"
          for f in "$d"/*; do echo "=== $(basename "$f")"; base64 -w0 "$f"; echo; done
          ls "$ANDROID_NDK_HOME/sources/android/"
