# The APK, built with the SDK's own toolchain ("One C++23 toolchain",
# phase 4): apt.llvm.org's clang 23 with sqterm's sysroot and runtimes
# packages from the `packages` release, at the keys this checkout's recipes
# give. The NDK is not used: ANDROID_NDK_HOME and the runner's NDKs are
# hidden from the build, so anything that reached for one fails here.
#
# What it shows: the native library and the APK build, link only against
# what an app may (libc, libm, libdl, libandroid, liblog, libEGL,
# libGLESv3), and carry the C++ runtime inside; packed and signed by
# apkpack, with no Java and no Android SDK, and the build's text work done
# by sqedit (both built here first, at the tags their recipes pin).
# Installing and starting it is the phone's part (make dev).
name: apk

on:
  push:
    branches: [main]
    paths:
      - Makefile
      - mk/**
      - sq_app/**
      - sq_android/**
      - squared/**
      - packages/sysroot/**
      - packages/runtimes/**
      - packages/apkpack/**
      - packages/sqedit/**
      - .github/workflows/apk.yml
  pull_request:
    paths:  # the same list as push
      - Makefile
      - mk/**
      - sq_app/**
      - sq_android/**
      - squared/**
      - packages/sysroot/**
      - packages/runtimes/**
      - packages/apkpack/**
      - packages/sqedit/**
      - .github/workflows/apk.yml
  workflow_dispatch:
    inputs:
      release:
        description: Publish test APKs as a prerelease (test-<commit>), basic and all
        type: boolean
        default: false

permissions:
  contents: write  # the test prerelease; everything else only reads

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: clang 23
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang-23 lld-23 llvm-23 zstd \
            libc++-23-dev libc++abi-23-dev
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: sysroot and runtimes, from the release
        run: |
          set -euo pipefail
          prefix=$RUNNER_TEMP/prefix
          mkdir -p "$prefix" "$RUNNER_TEMP/dl"
          bash packages/build.sh --keys > keys.txt
          for name in sysroot runtimes; do
            version= key=
            while read -r n v k _; do if [ "$n" = "$name" ]; then version=$v key=$k; fi; done < keys.txt
            file=$name-$version-$key.tar.zst
            gh release download packages -R "$GITHUB_REPOSITORY" -p "$file" -D "$RUNNER_TEMP/dl" ||
              { echo "::error::$file is not in the release yet (the packages workflow publishes it from main)"; exit 1; }
            tar --zstd -xf "$RUNNER_TEMP/dl/$file" -C "$prefix"
          done
          {
            echo "SQ_SYSROOT=$prefix/share/sysroot"
            echo "SQ_RUNTIMES=$prefix"
            echo "SQ_LLVM_BIN=/usr/lib/llvm-23/bin"
          } >> "$GITHUB_ENV"

      - name: sqedit and apkpack for this machine, at their recipes' tags
        run: |
          set -euo pipefail
          for name in sqedit apkpack; do
            tag=$(bash -c ". packages/$name/recipe.sh; echo \$tag")
            git clone --quiet --depth 1 --branch "$tag" "https://github.com/squared-netizen/$name" "$RUNNER_TEMP/$name"
            make -C "$RUNNER_TEMP/$name" -j4 CXX=clang++ CC=clang AR=llvm-ar "build/$name"
            echo "$RUNNER_TEMP/$name/build" >> "$GITHUB_PATH"
          done

      - name: No NDK, no Android SDK tools
        run: |
          echo "ANDROID_NDK_HOME=" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LATEST_HOME=" >> "$GITHUB_ENV"

      # The squared key (SIGNING.md), where the build signs with it. Without
      # the secret (a pull request from a fork, or before it is added) apkpack
      # makes a key for this run, and the test release below refuses to run.
      - name: The squared key
        env:
          APKPACK_KEY: ${{ secrets.APKPACK_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$APKPACK_KEY" ]; then
            mkdir -p ~/.android
            ( umask 077; printf '%s\n' "$APKPACK_KEY" > ~/.android/apkpack.pem )
            echo "SQ_SIGNED=squared" >> "$GITHUB_ENV"
            echo "signing with the squared key"
          else
            echo "SQ_SIGNED=run" >> "$GITHUB_ENV"
            echo "::warning::no APKPACK_KEY secret: signing with a key made for this run"
          fi

      - name: Build the APK (SQ_TOOLCHAIN=1)
        run: |
          set -euo pipefail
          # The NDKs out of sight: a path into one would fail to resolve.
          sudo mv "$ANDROID_HOME/ndk" "$RUNNER_TEMP/ndk-hidden" 2>/dev/null || true
          clang --version | head -n 1
          make -j4 SQ_TOOLCHAIN=1 status 2>&1 | tail -n 30 || true
          make -j4 SQ_TOOLCHAIN=1 apk
          apkpack verify build/sqterm.apk

      - name: What it links
        run: |
          so=$(ls build/lib/*/libsqterm.so 2>/dev/null || find build -name 'libsqterm.so' | head -n 1)
          llvm-readelf -d "$so" | sqedit match -F NEEDED
          ! llvm-readelf -d "$so" | sqedit match -q '"NEEDED" (!("c++" / "unwind") .)* ("c++" / "unwind")'
          ls -l build/*.apk

      # Run by hand with `release` ticked: two APKs as a prerelease to install
      # on the phone, each with its packages from the `packages` release
      # (tools/fetch_packages.sh --bundle): basic (zsh, pkg) and all (every
      # package). Signed with the squared key, and only with it: each APK's
      # certificate must be the one SIGNING.md records.
      - name: Test release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: |
          set -euo pipefail
          [ "$SQ_SIGNED" = squared ] ||
            { echo "::error::no APKPACK_KEY secret: a release is signed with the squared key (SIGNING.md)"; exit 1; }
          want=$(sqedit pick '"certificate SHA-256: " {%x+}' SIGNING.md || true)
          [ ${#want} -eq 64 ] ||
            { echo "::error::SIGNING.md records no certificate SHA-256: add the squared key's (apkpack keygen printed it)"; exit 1; }
          tag=test-${GITHUB_SHA::7}
          files=()
          for bundle in basic all; do
            bash tools/fetch_packages.sh --bundle "$bundle"
            rm -f build/sqterm.apk
            make -j4 SQ_TOOLCHAIN=1 apk
            got=$(apkpack verify build/sqterm.apk)
            echo "$got"
            [ "${got##* }" = "$want" ] ||
              { echo "::error::signed with ${got##* }, not the squared key $want (SIGNING.md)"; exit 1; }
            apk=sqterm-$tag-$bundle-arm64-v8a.apk
            cp build/sqterm.apk "$apk"
            sha256sum "$apk" > "$apk.sha256"
            files+=("$apk" "$apk.sha256")
            ls -l "$apk"
          done
          gh release create "$tag" "${files[@]}" --prerelease --target "$GITHUB_SHA" \
            --title "sqterm $tag (arm64-v8a, test)" \
            --notes "Test builds of $GITHUB_SHA for arm64-v8a, API 28 and later. basic: zsh and pkg (pkg installs the rest). all: every package bundled. Signed with the squared key, certificate SHA-256 $want (SIGNING.md): apkpack verify prints it."
